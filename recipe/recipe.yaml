schema_version: 1

context:
  name: pypar
  version: 0.0.6

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/pypar-${{ version }}.tar.gz
  sha256: e69a3c3e974451ae29bf0889fb22b5b93ff17209f035dbdb63373a89f495e971

build:
  number: 2
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - numpy

tests:
  - python:
      imports:
        - pypar
      pip_check: true
      python_version:
        - ${{ python_min }}
        - "*"

about:
  summary: Python phoneme alignment representation
  license: MIT
  license_file: LICENSE
  homepage: https://github.com/maxrmorrison/pypar

extra:
  recipe-maintainers:
    - jan-janssen
